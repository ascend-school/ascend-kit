# Checks on every push; a deploy only from main.
#
# Cloudflare's own Workers Builds would need its GitHub App installed by hand
# in the dashboard. This does the same job with the wrangler the repo already
# has, and one org secret.
name: ci
on:
  # Every branch, not only main and open pull requests: work sits on long-lived
  # branches here, and a branch without a PR was running no checks at all.
  push:
  pull_request:
  # Runnable by hand. Also the only way to exercise CI while push-triggered runs
  # are not firing for this org.
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
