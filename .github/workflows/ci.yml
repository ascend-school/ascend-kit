# Checks on every push; a deploy only from main.
#
# Cloudflare's own Workers Builds would need its GitHub App installed by hand
# in the dashboard. This does the same job with the wrangler the repo already
# has, and one org secret.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
